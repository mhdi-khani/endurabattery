<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F8F6FA" />
  <meta name="robots" content="index,follow" />
  <meta name="description" content="اندورا باتری؛ فروشگاه تخصصی باتری خودرو، خودروهای سنگین، یوپی‌اس و سولار با خدمات ارسال و نصب در مناطق تحت پوشش." />
  <title>Endura Battery | فروشگاه تخصصی باتری</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <script>
  (function(){try{var saved=localStorage.getItem('endura-theme');var dark=(saved==='dark'||(saved!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches));document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#160A2C':'#F8F6FA';}catch(e){document.documentElement.dataset.theme='light';}})();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/brand-theme.css" />
  <link rel="stylesheet" href="assets/css/hero-slider.css" />
</head>
<body>
  <div id="app"><div class="loading-screen"><div class="loading-symbol">E</div><p>ENDURA BATTERY</p><small>در حال بارگذاری فروشگاه...</small></div></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
